# Local development profile. Loads the starter data and relaxes cookie security
# for http://localhost. Never use this profile in production.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed-dev

app:
  security:
    cookie-secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

logging:
  level:
    com.supermarket.pos: DEBUG
