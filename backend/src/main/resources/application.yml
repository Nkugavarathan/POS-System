# Base configuration shared by all profiles. Secrets come only from environment
# variables (or a local, git-ignored backend/.env file in development).
spring:
  application:
    name: pos-backend
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50
        query:
          fail_on_pagination_over_collection_fetch: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

app:
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: PT10M
    refresh-token-ttl: PT12H
    refresh-family-max-lifetime: P7D
    approval-token-ttl: PT2M
    cookie-secure: ${COOKIE_SECURE:true}
    max-failed-logins: 5
    lockout-duration: PT15M
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  idempotency:
    retention: P7D

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
